[package]
name = "server-pilot-ru"
version = "1.0.0-beta.1"
description = "ServerPilot RU — Управление Linux-серверами"
authors = ["ServerPilot RU"]
edition = "2021"

[lib]
name = "server_pilot_ru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "server-pilot-ru"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
ssh2 = "0.9"
tokio = { version = "1.36", features = ["full"] }
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
hex = "0.4"
once_cell = "1.19"
dirs = "5.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
